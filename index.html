<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting...</title>

  <!-- নিচের দুই জায়গায় (meta + script) আপনার নতুন লিংক বসান -->
  <meta http-equiv="refresh" content="0; url=https://example.com">
  <link rel="canonical" href="https://example.com">
  <meta name="robots" content="noindex">

  <script>
    var TARGET_URL = "https://www.profitableratecpmnetwork.com/fex8vzayn?key=3a281652e5c6516f3947a82af3853513"; // <-- এখানে আপনার লিংক দিন
    window.location.replace(TARGET_URL);
  </script>

  <style>
    body { font-family: sans-serif; text-align: center; padding: 3rem 1rem; }
  </style>
</head>
<body>
  <p>রিডাইরেক্ট হচ্ছে...</p>
  <p>স্বয়ংক্রিয়ভাবে না হলে <a href="https://example.com">এখানে ক্লিক করুন</a>।</p>
</body>
</html>
